# Builds the standalone for Linux, macOS and Windows and stages a draft release from a v* tag.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            runner: ubuntu-22.04
            shell: bash
          - name: macos arm64
            runner: macos-latest
            shell: bash
          - name: macos x86_64
            runner: macos-15-intel
            shell: bash
          - name: windows x64
            runner: windows-latest
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # The tag must name the version compiled into the binary, so a
      # "-dev" build can never ship under a release tag by accident.
      - name: tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^#define APP_VERSION "\(.*\)"/\1/p' src/gui/app.h)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag does not match APP_VERSION $ver in src/gui/app.h" >&2
            exit 1
          fi

      - name: deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libfreetype-dev libasound2-dev libx11-dev

      # Homebrew bottles carry the runner's minimum-OS floor, so SDL2,
      # FreeType, libpng and zlib are built from source as static libraries
      # against a fixed deployment target and linked in; see macos-deps.sh.
      - name: cache deps (macos)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/deps
          key: macos-deps-${{ runner.arch }}-${{ hashFiles('.github/macos-deps.sh') }}

      - name: deps (macos)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config make cmake
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          prefix="$HOME/deps"
          if [ ! -f "$prefix/lib/libSDL2.a" ]; then
            .github/macos-deps.sh "$prefix"
          else
            echo "reusing cached $prefix"
          fi
          export PATH="$prefix/bin:$PATH" PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "sdl2-config --static-libs: $(sdl2-config --static-libs)"
          echo "pkg-config --static --libs sdl2: $(pkg-config --static --libs sdl2)"
          echo "pkg-config --static --libs freetype2: $(pkg-config --static --libs freetype2)"

      - name: deps (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            curl
            git
            make
            zip
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype

      - name: clap headers
        run: git clone --depth 1 https://github.com/free-audio/clap /tmp/clap

      - name: engine tests
        run: |
          make -j4 check

      # every platform embeds its own editor, so the plugin builds everywhere
      # and has to exist before `dist` stages the archive
      - name: clap
        run: make -j4 bypo.clap EXTRA_CPPFLAGS=-I/tmp/clap/include

      # A host finds DLLs on its own search path, not in the plugin's folder,
      # so the .clap must import nothing that MSYS2 ships; the exe keeps SDL2
      # and FreeType beside it but carries the MinGW runtime itself.
      - name: dist
        run: make dist

      - name: static imports (windows)
        if: runner.os == 'Windows'
        run: |
          imports() { objdump -p "$1" | awk '/DLL Name/ {print $3}'; }
          for f in bypo.clap blow-your-phase-off-gui.exe; do
            echo "== $f imports:"; imports "$f"
          done
          bad="$(imports bypo.clap | grep -Ei '^(lib|zlib|SDL2)' || true)"
          if [ -n "$bad" ]; then
            echo "bypo.clap imports DLLs a host will not find: $bad" >&2
            exit 1
          fi
          bad="$(imports blow-your-phase-off-gui.exe | grep -Ei '^lib(gcc|stdc|winpthread)' || true)"
          if [ -n "$bad" ]; then
            echo "the exe imports the MinGW runtime: $bad" >&2
            exit 1
          fi

      - name: what shipped
        run: |
          ls -la bypomono-*
          case "$(uname -s)" in
            Linux)  tar tzf bypomono-*.tar.gz ;;
            *)      unzip -l bypomono-*.zip ;;
          esac | grep -v 'assets/fonts\|presets/BYPO/' || true

      # `dist` removes the staged folder once it is archived; stage it again so
      # the smoke steps exercise the exact tree that ships.
      - name: restage for smoke
        run: |
          make stage
          mkdir -p smoke
          echo "DIST=$(ls -d bypomono-*/ | head -1 | tr -d '/')" >> "$GITHUB_ENV"

      # The runner has no sound card and the standalone refuses to start
      # without an output device, so `default` is pointed at ALSA's null pcm.
      - name: smoke deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb imagemagick x11-apps
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"

      - name: 'smoke: plugin'
        env:
          CLAP_VALIDATOR: 0.4.1-127-g152b982
        run: |
          case "${{ runner.os }}" in
            Linux)   asset=ubuntu-22.04 ;;
            macOS)   asset=macos-universal ;;
            Windows) asset=windows ;;
          esac
          cvdir="$PWD/.clap-validator"
          mkdir -p "$cvdir"
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o "$cvdir/cv.zip" \
            "https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-$CLAP_VALIDATOR-$asset.zip"
          unzip -oq "$cvdir/cv.zip" -d "$cvdir"
          if ls "$cvdir"/*.tar.gz >/dev/null 2>&1; then
            tar xzf "$cvdir"/*.tar.gz -C "$cvdir"
          fi
          cv="$(find "$cvdir" -maxdepth 2 -type f -name 'clap-validator*' \
                ! -name '*.zip' ! -name '*.tar.gz' | head -1)"
          chmod +x "$cv"
          "$cv" --version
          cd "$DIST"
          "$cv" validate bypo.clap

      - name: 'smoke: standalone'
        if: runner.os == 'Linux'
        env:
          BYPO_SCALE: '1'
        run: |
          cd "$DIST"
          xvfb-run -a -s '-screen 0 1280x1024x24' bash -c '
            set -e
            ./blow-your-phase-off-gui &
            pid=$!
            trap "kill -TERM $pid 2>/dev/null || true" EXIT
            sleep 6
            import -window root ../smoke/${{ matrix.runner }}.png \
              || xwd -root -silent | convert xwd:- ../smoke/${{ matrix.runner }}.png
            kill -0 "$pid" || { echo "standalone exited before termination" >&2; exit 1; }
          '

      - name: 'smoke: standalone'
        if: runner.os == 'macOS'
        env:
          BYPO_SCALE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          cd "$DIST"
          ./BYPO.app/Contents/MacOS/blow-your-phase-off-gui &
          pid=$!
          trap "kill -TERM $pid 2>/dev/null || true" EXIT
          sleep 6
          screencapture -x "../smoke/${{ matrix.runner }}.png"
          kill -0 "$pid" || { echo "standalone exited before termination" >&2; exit 1; }

      - name: 'smoke: standalone'
        if: runner.os == 'Windows'
        env:
          BYPO_SCALE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          powershell -ExecutionPolicy Bypass \
            -File "$(cygpath -w "$PWD/.github/smoke-windows.ps1")" \
            -Exe "$(cygpath -w "$PWD/$DIST/blow-your-phase-off.exe")" \
            -Shot "$(cygpath -w "$PWD/smoke/${{ matrix.runner }}.png")"

      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.runner }}
          if-no-files-found: warn
          path: smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: bypomono-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            bypomono-*.tar.gz
            bypomono-*.zip
            bypomono-*-SHA256SUMS.txt

  draft-release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > out/NOTES.md
          echo "--- release body ---"; cat out/NOTES.md; echo "--------------------"
          ls -la out

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: false
          name: ${{ github.ref_name }}
          body_path: out/NOTES.md
          fail_on_unmatched_files: true
          files: |
            out/bypomono-*.tar.gz
            out/bypomono-*.zip
            out/bypomono-*-SHA256SUMS.txt
