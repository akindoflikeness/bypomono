# Build the standalone for Linux, macOS (Apple silicon and Intel) and Windows,
# and stage a DRAFT GitHub release from one tag.
#
# Nothing here starts on its own except a tag you push yourself:
#   git tag -a v1.1.0 -m "release notes, in your words"
#   git push origin v1.1.0
# or a manual dispatch (which builds and uploads artifacts but does not
# touch releases).
#
# The release is created as a draft, and its body is the annotated tag's
# message verbatim; nothing is auto-generated. Nothing is public until the
# draft is reviewed and published by hand on the Releases page.
#
# Each platform runs `make dist`, which stages the GUI binary next to
# README, LICENSE, THIRD-PARTY-LICENSES, assets/ and the BYPO preset bank,
# archives it (tar.gz on Linux so the executable bit survives, zip elsewhere)
# and writes a SHA256SUMS file. The Linux job also ships bypo.clap.
#
# Runner billing on a private repo: Linux 1x, Windows 2x, macOS 10x. Once the
# repo is public, all of it is free.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            runner: ubuntu-22.04
            shell: bash
          - name: macos arm64
            runner: macos-latest
            shell: bash
          - name: macos x86_64
            runner: macos-15-intel
            shell: bash
          - name: windows x64
            runner: windows-latest
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      # The tag must name the version compiled into the binary, so a
      # "-dev" build can never ship under a release tag by accident.
      - name: tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^#define APP_VERSION "\(.*\)"/\1/p' src/gui/app.h)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag does not match APP_VERSION $ver in src/gui/app.h" >&2
            exit 1
          fi

      - name: deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libfreetype-dev libasound2-dev libx11-dev
          git clone --depth 1 https://github.com/free-audio/clap /tmp/clap

      - name: deps (macos)
        if: runner.os == 'macOS'
        run: brew install sdl2 freetype pkg-config dylibbundler

      - name: deps (windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            zip
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-freetype

      - name: engine tests
        run: |
          make -j4 bypo-tests
          ./bypo-tests

      - name: build
        run: make -j4 blow-your-phase-off blow-your-phase-off-gui

      - name: clap (linux)
        if: runner.os == 'Linux'
        run: make -j4 bypo.clap EXTRA_CPPFLAGS=-I/tmp/clap/include

      - name: dist
        run: make dist

      - name: what shipped
        run: |
          ls -la bypomono-*
          case "$(uname -s)" in
            Linux)  tar tzf bypomono-*.tar.gz ;;
            *)      unzip -l bypomono-*.zip ;;
          esac | grep -v 'assets/fonts\|presets/BYPO/' || true

      - uses: actions/upload-artifact@v4
        with:
          name: bypomono-${{ matrix.runner }}
          if-no-files-found: error
          path: |
            bypomono-*.tar.gz
            bypomono-*.zip
            bypomono-*-SHA256SUMS.txt
            bypo.clap

  draft-release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # The release body is the annotated tag's message, nothing else. A
      # lightweight tag gives an empty body to fill in before publishing.
      - name: release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > out/NOTES.md
          echo "--- release body ---"; cat out/NOTES.md; echo "--------------------"
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          name: ${{ github.ref_name }}
          body_path: out/NOTES.md
          fail_on_unmatched_files: true
          files: |
            out/bypomono-*.tar.gz
            out/bypomono-*.zip
            out/bypomono-*-SHA256SUMS.txt
            out/bypo.clap
